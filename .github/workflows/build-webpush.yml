name: Build Web Push Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, openssl, gmp, bcmath
          tools: composer:v2
          coverage: none

      - name: Create composer.json
        run: |
          cat > composer.json <<'JSON'
          {
            "require": {
              "php": ">=8.2",
              "minishlink/web-push": "11.0.0",
              "php-http/guzzle7-adapter": "^1.1"
            },
            "config": {
              "allow-plugins": {
                "php-http/discovery": true
              },
              "preferred-install": "dist",
              "sort-packages": true
            }
          }
          JSON

      - name: Download dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Create dependency list
        run: |
          composer show --no-dev > DEPENDENCIES.txt

      - name: Test Web Push
        run: |
          php -r "
          require 'vendor/autoload.php';

          if (!class_exists('Minishlink\\WebPush\\WebPush')) {
              exit(1);
          }

          if (!class_exists('Minishlink\\WebPush\\Subscription')) {
              exit(1);
          }

          echo 'Web Push dependencies OK' . PHP_EOL;
          "

      - name: Create ZIP
        run: |
          zip -r web-push-dependencies.zip \
            vendor \
            composer.lock \
            DEPENDENCIES.txt

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: web-push-dependencies
          path: web-push-dependencies.zip
          retention-days: 7
