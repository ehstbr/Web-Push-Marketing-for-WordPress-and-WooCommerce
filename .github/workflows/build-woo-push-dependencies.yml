from pathlib import Path

workflow = """name: Build Woo Push Dependencies

'on':
  workflow_dispatch: {}

jobs:
  build:
    name: Build bundled dependencies
    runs-on: ubuntu-latest

    env:
      ACTION_SCHEDULER_VERSION: '4.2.0'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, openssl, gmp, bcmath
          tools: composer:v2
          coverage: none

      - name: Create composer.json
        shell: bash
        run: |
          cat > composer.json <<'JSON'
          {
            "require": {
              "php": ">=8.2",
              "minishlink/web-push": "11.0.0",
              "php-http/guzzle7-adapter": "^1.1"
            },
            "config": {
              "allow-plugins": {
                "php-http/discovery": true
              },
              "preferred-install": "dist",
              "sort-packages": true,
              "optimize-autoloader": true
            }
          }
          JSON

      - name: Install Web Push dependencies
        shell: bash
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Test Web Push runtime
        shell: bash
        run: |
          php -r "require 'vendor/autoload.php'; if (!class_exists('Minishlink\\\\WebPush\\\\WebPush')) { exit(1); } echo 'Web Push runtime OK' . PHP_EOL;"

      - name: Download Action Scheduler
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \\
            --output action-scheduler.zip \\
            "https://github.com/woocommerce/action-scheduler/archive/refs/tags/${ACTION_SCHEDULER_VERSION}.zip"

          mkdir -p action-scheduler-source
          unzip -q action-scheduler.zip -d action-scheduler-source

          AS_SOURCE="$(find action-scheduler-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          test -n "$AS_SOURCE"
          test -f "$AS_SOURCE/action-scheduler.php"

          echo "Action Scheduler ${ACTION_SCHEDULER_VERSION} downloaded successfully."

      - name: Prepare libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/libraries/web-push
          mkdir -p build/libraries/action-scheduler

          cp -a vendor build/libraries/web-push/vendor
          cp composer.lock build/libraries/web-push/composer.lock

          composer show --no-dev > build/libraries/web-push/DEPENDENCIES.txt

          AS_SOURCE="$(find action-scheduler-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -a "$AS_SOURCE"/. build/libraries/action-scheduler/

          rm -rf \\
            build/libraries/action-scheduler/.git \\
            build/libraries/action-scheduler/.github \\
            build/libraries/action-scheduler/tests \\
            build/libraries/action-scheduler/node_modules

          rm -f \\
            build/libraries/action-scheduler/.editorconfig \\
            build/libraries/action-scheduler/.gitattributes \\
            build/libraries/action-scheduler/.gitignore \\
            build/libraries/action-scheduler/package.json \\
            build/libraries/action-scheduler/package-lock.json

          test -f build/libraries/action-scheduler/action-scheduler.php
          test -f build/libraries/web-push/vendor/autoload.php

      - name: Create package README
        shell: bash
        run: |
          cat > build/README.txt <<'TXT'
          Woo Push Marketing - bundled PHP dependencies

          Included:
          - minishlink/web-push 11.0.0 and its production dependencies
          - php-http/guzzle7-adapter and its production dependencies
          - Action Scheduler 4.2.0

          Runtime paths:
          - libraries/web-push/vendor/autoload.php
          - libraries/action-scheduler/action-scheduler.php

          Composer is used only by GitHub Actions during this build.
          Composer is not required on the WordPress server.
          TXT

      - name: Create ZIP
        shell: bash
        run: |
          cd build
          zip -r ../woo-push-libraries.zip libraries README.txt
          cd ..

      - name: Verify ZIP
        shell: bash
        run: |
          test -f woo-push-libraries.zip
          unzip -l woo-push-libraries.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: woo-push-libraries
          path: woo-push-libraries.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
"""

path = Path("/mnt/data/build-woo-push-dependencies-fixed.yml")
path.write_text(workflow, encoding="utf-8")
print(f"Arquivo corrigido: {path}")
